<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Job | JobPortal</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #243047;
        }

        .form-container {
            max-width: 650px;
            margin: 45px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #142b55;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccd4e0;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button, .cancel {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
        }

        button {
            background: #155eef;
            color: white;
        }

        .cancel {
            background: #e8edf5;
            color: #243047;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form-container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <span class="logo-icon">💼</span>
            <span>JobPortal</span>
        </div>

        <nav>
            <a href="/">Home</a>
            <a href="/list-jobs.html">Browse Jobs</a>
            <a href="/add-job.html">Post a Job</a>
        </nav>
    </header>

    <main class="form-container">
        <h1>Update Job Details</h1>
        <p>Edit the information below and save your changes.</p>

        <form id="editForm">

            <label for="title">Title of Job</label>
            <input type="text" id="title" required>

            <label for="company">Company</label>
            <input type="text" id="company" required>

            <label for="location">Location</label>
            <input type="text" id="location" required>

            <label for="salary">Salary (₹)</label>
            <input type="number" id="salary" min="0" step="0.01">

            <label for="skills">Skills</label>
            <textarea id="skills" required></textarea>

            <label for="interview_date">Interview Date</label>
            <input type="date" id="interview_date">

            <div class="buttons">
                <button type="submit">Save Changes</button>
                <a class="cancel" href="/list-jobs.html">Cancel</a>
            </div>

            <p id="message" role="status"></p>

        </form>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const jobId = params.get("id");
        const message = document.getElementById("message");
        const form = document.getElementById("editForm");

        if (!jobId) {
            message.textContent = "Job ID is missing.";
            form.hidden = true;
        } else {
            loadJob();
        }

        async function loadJob() {
            try {
                const response = await fetch("/jobs");

                if (!response.ok) {
                    throw new Error("Unable to load jobs.");
                }

                const jobs = await response.json();

                const job = jobs.find(
                    item => String(item.job_id) === String(jobId)
                );

                if (!job) {
                    message.textContent = "Job not found.";
                    form.hidden = true;
                    return;
                }

                document.getElementById("title").value =
                    job.title || "";

                document.getElementById("company").value =
                    job.company || "";

                document.getElementById("location").value =
                    job.location || "";

                document.getElementById("salary").value =
                    job.salary ?? "";

                document.getElementById("skills").value =
                    job.skills || "";

                document.getElementById("interview_date").value =
                    job.interview_date
                        ? String(job.interview_date).slice(0, 10)
                        : "";

            } catch (error) {
                message.textContent = error.message;
            }
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const salaryValue =
                document.getElementById("salary").value;

            const updatedJob = {
                title: document.getElementById("title").value.trim(),
                company: document.getElementById("company").value.trim(),
                location: document.getElementById("location").value.trim(),
                salary: salaryValue === "" ? null : Number(salaryValue),
                skills: document.getElementById("skills").value.trim(),
                interview_date:
                    document.getElementById("interview_date").value || null
            };

            try {
                const response = await fetch(
                    "/jobs/" + encodeURIComponent(jobId),
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(updatedJob)
                    }
                );

                const result = await response.text();

                if (!response.ok) {
                    throw new Error(result);
                }

                alert(result);
                window.location.href = "/list-jobs.html";

            } catch (error) {
                message.textContent = error.message;
            }
        });
    </script>

</body>
</html>
